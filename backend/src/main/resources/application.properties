spring.application.name=credit-scoring

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_scoring}
spring.datasource.username=${DB_USERNAME:credit_scoring}
spring.datasource.password=${DB_PASSWORD:credit_scoring}

# JPA / Hibernate: el esquema lo gestiona Flyway, nunca ddl-auto
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (el secreto NUNCA debe quedar hardcodeado en producción; usar la variable de entorno)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bootstrap del primer usuario ADMIN (solo se ejecuta si la tabla de usuarios está vacía)
admin.bootstrap.username=${ADMIN_USERNAME:admin}
admin.bootstrap.password=${ADMIN_PASSWORD:ChangeMe123!}

# Servicio de ML (FastAPI): /score y /explain
ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml-service.connect-timeout=${ML_SERVICE_CONNECT_TIMEOUT:2s}
ml-service.read-timeout=${ML_SERVICE_READ_TIMEOUT:5s}

# Política de crédito: umbrales sobre la probabilidad de default (PD) del modelo + reglas duras.
# PD <= approve-max -> APPROVED; PD >= reject-min -> REJECTED; entre ambos -> MANUAL_REVIEW.
# Ojo: el modelo se entrena con class_weight="balanced", así que sus probabilidades no están
# calibradas a la tasa real de default (~7%); los umbrales deben revisarse con cada versión.
credit-policy.approve-max-probability=${CREDIT_POLICY_APPROVE_MAX_PD:0.30}
credit-policy.reject-min-probability=${CREDIT_POLICY_REJECT_MIN_PD:0.60}
# Endeudamiento máximo (deuda mensual existente + cuota nueva) / ingreso mensual
credit-policy.max-debt-ratio=${CREDIT_POLICY_MAX_DEBT_RATIO:0.50}
credit-policy.min-applicant-age=${CREDIT_POLICY_MIN_APPLICANT_AGE:18}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
