spring.application.name=credit-scoring

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_scoring}
spring.datasource.username=${DB_USERNAME:credit_scoring}
spring.datasource.password=${DB_PASSWORD:credit_scoring}

# JPA / Hibernate: el esquema lo gestiona Flyway, nunca ddl-auto
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (el secreto NUNCA debe quedar hardcodeado en producción; usar la variable de entorno)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bootstrap del primer usuario ADMIN (solo se ejecuta si la tabla de usuarios está vacía)
admin.bootstrap.username=${ADMIN_USERNAME:admin}
admin.bootstrap.password=${ADMIN_PASSWORD:ChangeMe123!}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
