services:
  postgres:
    image: postgres:16
    container_name: credit-scoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-credit_scoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_scoring}
    ports:
      - "5432:5432"
    volumes:
      - credit-scoring-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit_scoring}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: credit-scoring-ml-service
    restart: unless-stopped
    environment:
      ML_ARTIFACTS_DIR: /app/models
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data

  backend:
    build: ./backend
    container_name: credit-scoring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    # Toma JWT_SECRET, ADMIN_*, CREDIT_POLICY_* y CORS_ALLOWED_ORIGINS del .env si existe; si no,
    # aplican los valores por defecto de application.properties (solo aptos para desarrollo).
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credit_scoring}
      DB_USERNAME: ${POSTGRES_USER:-credit_scoring}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-credit_scoring}
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # URL del backend tal como la ve el navegador del usuario (no la red interna de Docker).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: credit-scoring-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  credit-scoring-postgres-data:
